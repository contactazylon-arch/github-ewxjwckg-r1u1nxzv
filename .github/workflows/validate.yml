name: Validate BotNexus

on:
  push:
    branches:
      - test/codex-access-check
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Topbot API connectivity diagnostic
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const url = "https://topbot.gg/api/v1/bots?page=1&limit=50&sort=votes_month";
          try {
            const response = await fetch(url, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(10000) });
            const body = await response.text();
            console.log(`Topbot API HTTP ${response.status}`);
            console.log(body.slice(0, 1000));
          } catch (error) {
            console.error("Topbot API connection failed:", error);
          }
          NODE
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build:vinext
