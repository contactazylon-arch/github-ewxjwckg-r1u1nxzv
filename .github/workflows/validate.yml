name: Validate BotNexus

on:
  push:
    branches:
      - test/codex-access-check
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Topbot API smoke test
        run: |
          node --input-type=module <<'NODE'
          const url = "https://topbot.gg/api/v1/bots?page=1&limit=50&sort=votes_month";
          const response = await fetch(url, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(10000),
          });
          console.log(`Topbot API HTTP ${response.status}`);
          if (!response.ok) throw new Error(`Topbot API returned HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload || !Array.isArray(payload.data)) {
            throw new Error("Unexpected Topbot response: data is not an array");
          }
          const validBots = payload.data.filter(bot =>
            bot && typeof bot.id === "string" && typeof bot.name === "string"
          );
          console.log(`Received ${payload.data.length} records; ${validBots.length} have the required id/name fields.`);
          if (validBots.length === 0) throw new Error("No valid bot records returned by Topbot");
          console.log("Sample bot:", JSON.stringify({
            id: validBots[0].id,
            name: validBots[0].name,
            hasDescription: Boolean(validBots[0].shortDescription || validBots[0].description),
            categories: Array.isArray(validBots[0].categories) ? validBots[0].categories.length : 0,
          }));
          NODE
      - name: Generate Cloudflare binding types
        run: npx cf workers types
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build:vinext
      - name: Select isolated test Worker
        run: |
          sed -i 's/name: "botnexus-app"/name: "botnexus-test"/' cloudflare.config.ts
      - name: Deploy test Worker to Cloudflare
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Discord App Directory API smoke test
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://botnexus-test.contact-azylon.workers.dev/api/catalog/discord?page=1&limit=10&locale=en";
          const response = await fetch(endpoint, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(30000),
          });
          const payload = await response.json().catch(() => null);
          console.log(`Discord directory API HTTP ${response.status}`);
          console.log("Discord directory response:", JSON.stringify(payload));
          if (!response.ok) throw new Error(`Discord directory API returned HTTP ${response.status}`);
          if (!payload || !Array.isArray(payload.bots) || !payload.pagination) {
            throw new Error("Discord directory API returned an unexpected response shape");
          }
          if (payload.bots.length === 0) {
            throw new Error("Discord directory API returned no bot records");
          }
          console.log(`Discord App Directory smoke test passed with ${payload.bots.length} bot records.`);
          NODE
      - name: Dashboard stats and monitoring smoke test
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://botnexus-test.contact-azylon.workers.dev/api/catalog/stats";
          const response = await fetch(endpoint, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(30000) });
          const payload = await response.json().catch(() => null);
          console.log(`Dashboard stats API HTTP ${response.status}`);
          console.log("Dashboard stats response:", JSON.stringify(payload));
          if (!response.ok) throw new Error(`Dashboard stats API returned HTTP ${response.status}`);
          if (!payload?.topbot || !payload?.discord || !payload?.monitoring || !payload?.activity) {
            throw new Error("Dashboard stats response is missing required sections");
          }
          if (typeof payload.monitoring.availableServices !== "number") throw new Error("Monitoring checks are missing");
          console.log("Dashboard stats and monitoring smoke test passed.");
          NODE
      - name: Activity tracking authentication smoke test
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://botnexus-test.contact-azylon.workers.dev/api/activity";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ event: "page_overview" }),
            signal: AbortSignal.timeout(15000),
          });
          const payload = await response.json().catch(() => null);
          console.log(`Activity API unauthenticated HTTP ${response.status}`);
          if (response.status !== 401 || payload?.reason !== "authentication_required") {
            throw new Error("Activity endpoint must reject unauthenticated events");
          }
          console.log("Activity tracking authentication smoke test passed.");
          NODE
      - name: Translation API smoke test
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://botnexus-test.contact-azylon.workers.dev/api/translate";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ text: "This Discord bot helps you manage your server." }),
            signal: AbortSignal.timeout(30000),
          });
          const payload = await response.json().catch(() => null);
          console.log(`Translation API HTTP ${response.status}`);
          console.log("Translation API response:", JSON.stringify(payload));
          if (!response.ok) throw new Error(`Translation API returned HTTP ${response.status}`);
          if (!payload || typeof payload.translatedText !== "string" || !payload.translatedText.trim()) {
            throw new Error("Translation API did not return translatedText");
          }
          console.log("Translation API smoke test passed.");
          NODE
